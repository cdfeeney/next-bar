name: CI

# Push-protocol gate (operator ask 2026-07-25): every PR and every push to
# main runs the same three gates the local workflow uses — type-check,
# unit tests, production build. With branch protection requiring this
# check, a build that would fail on Vercel can never reach main (today's
# edge-bundle-size failure would have been caught at the PR).
#
# E2e (Playwright) is deliberately NOT here yet: it needs browser installs
# + a dev server and roughly 10x the minutes. Add as a separate
# nightly/PR-labeled job when the team grows.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Production build
        run: npm run build
        env:
          # Build-time publics only — no secrets. Supabase URL/key are the
          # anon publishables and are only needed if a page prerenders
          # against them; the build tolerates their absence (dual-mode).
          NEXT_TELEMETRY_DISABLED: '1'

  # A migration numbered at or below the serving ledger head, and absent from
  # the ledger, is refused by apply-migration-set.ts — so it can be committed,
  # reviewed, merged and shipped while being permanently unappliable. Nothing
  # said so until someone tried to apply it. This says so at the PR.
  #
  # Its own job, not a step in `gates`: it is the only thing here that needs a
  # database, and a type error should not hide a ledger violation or vice versa.
  #
  # DELIBERATELY NOT `if: secrets.* != ''`. The guard is fail-closed by design
  # (exit 2, "COULD NOT VERIFY"), and skipping it when the connection is
  # missing is exactly the silent pass it exists to remove. Until
  # MIGRATION_LEDGER_DATABASE_URL is set to a read-only NON-production
  # connection, this job fails loudly and says why.
  #
  # OPERATOR ACTION, outside this file: a red job only BLOCKS a merge once
  # `migration-ledger` is added to the branch-protection required status checks
  # next to `gates`. Until then it is an advisory red X a reviewer has to
  # notice — which is the manual step this whole guard exists to remove. Enrol
  # it at the same time as the secret and the two vars, not before: a required
  # check with no credential configured blocks every merge.
  migration-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # THE CREDENTIAL MUST NEVER REACH CODE THE PR CONTROLS. `on: pull_request`
      # runs with repository secrets for any same-repo branch, and
      # `npm run check:migrations` resolves through the checked-out tree's
      # package.json and its scripts — so a PR editing either could print or
      # exfiltrate DATABASE_URL, and neither the read-only session nor the
      # production refusal would stop it.
      #
      # So: the BASE commit is the code that runs, and the PR head is checked
      # out only as DATA. The guard reads filenames out of it and executes
      # nothing from it. Consequence worth knowing: a PR that changes the guard
      # itself is validated by the OLD guard, and the PR that first adds this
      # job fails because the base commit has no `check:migrations` script.
      # Both are the fail-closed direction.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: pr
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Migrations are appliable against the serving ledger
        run: npm run check:migrations
        env:
          # The PR's migrations, read by the base commit's guard.
          MIGRATION_LEDGER_DIR: pr/supabase/migrations
          DATABASE_URL: ${{ secrets.MIGRATION_LEDGER_DATABASE_URL }}
          # The label is mandatory and the guard refuses "production" outright.
          NEXT_BAR_DATABASE_ENVIRONMENT: ${{ vars.MIGRATION_LEDGER_ENVIRONMENT }}
          # Mandatory: the guard refuses to connect on a label alone.
          NEXT_BAR_PRODUCTION_PROJECT_REF: ${{ vars.NEXT_BAR_PRODUCTION_PROJECT_REF }}
          # Optional positive allowlist, same semantics as apply-migration-set.ts.
          NEXT_BAR_STAGING_PROJECT_REFS: ${{ vars.NEXT_BAR_STAGING_PROJECT_REFS }}
