name: CI

# Push-protocol gate (operator ask 2026-07-25): every PR and every push to
# main runs the same three gates the local workflow uses — type-check,
# unit tests, production build. With branch protection requiring this
# check, a build that would fail on Vercel can never reach main (today's
# edge-bundle-size failure would have been caught at the PR).
#
# E2e (Playwright) is deliberately NOT here yet: it needs browser installs
# + a dev server and roughly 10x the minutes. Add as a separate
# nightly/PR-labeled job when the team grows.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Cheapest gate first and it needs no install state: a committed
      # credential should fail the PR before anything else spends minutes.
      # Deliberately narrow (see scripts/secret-scan.mjs) — a scanner that
      # cries wolf gets disabled, and a disabled scanner is worse than none.
      # Verified against this repository: clean over 484 tracked files, and
      # it still catches a planted key.
      - name: Secret scan
        run: node scripts/secret-scan.mjs
      # Env-var safety. Same reasoning as the secret scan above: cheap, narrow,
      # and it must not cry wolf — it was fixed once already for manufacturing a
      # CRITICAL on the legitimately-public Google browser key.
      #
      # NOTE the deliberate absence of `--environment production`. CI is not a
      # deployment: it holds no Supabase variables (the build is dual-mode, see
      # the build step below), so forcing the production profile here would fail
      # every run on variables that are *correctly* absent. Verified by running
      # it — it exited 1. Without the flag it derives from VERCEL_ENV and falls
      # back to `local`, which still catches the dangerous class (a server
      # secret mirrored under a NEXT_PUBLIC_ name) without demanding deployment
      # values CI has no business holding.
      #
      # The rule set that DOES need real values is enforced where those values
      # exist: the `prebuild` script runs this same check on Vercel, where
      # VERCEL_ENV makes it production/preview and a bad env fails the deploy.
      - name: Env-var safety check
        run: node scripts/check-env.mjs
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Production build
        run: npm run build
        env:
          # Build-time publics only — no secrets. Supabase URL/key are the
          # anon publishables and are only needed if a page prerenders
          # against them; the build tolerates their absence (dual-mode).
          NEXT_TELEMETRY_DISABLED: '1'
