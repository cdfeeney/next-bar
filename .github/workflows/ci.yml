name: CI

# Push-protocol gate (operator ask 2026-07-25): every PR and every push to
# main runs type-check, unit tests, and the production build. With branch
# protection requiring this check, a build that would fail on Vercel can never
# reach main (today's edge-bundle-size failure would have been caught at the PR).
#
# THIS IS NOT THE FULL GATE. The local standard gate is typecheck + vitest +
# `npm run test:e2e:release` (CLAUDE.md); this job runs the first two and the
# build, and does NOT run the browser specs. A green check here therefore does
# not mean the e2e suite passed — that is the same invisibility that let the
# Playwright suite sit red for weeks, so it is stated rather than assumed.
#
# E2e is deliberately still out: it needs browser installs + a server and
# roughly 10x the minutes. Add as a separate nightly/PR-labeled job when the
# team grows; until then the e2e leg is run locally before push.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Production build
        run: npm run build
        env:
          # Build-time publics only — no secrets. Supabase URL/key are the
          # anon publishables and are only needed if a page prerenders
          # against them; the build tolerates their absence (dual-mode).
          NEXT_TELEMETRY_DISABLED: '1'
