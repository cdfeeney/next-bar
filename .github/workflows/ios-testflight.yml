name: iOS TestFlight

# Manual trigger only. Run from the Actions tab (or `gh workflow run
# ios-testflight.yml`) whenever the native shell changes. Ordinary web
# deploys do NOT need this — the shell loads the live site.
on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync Capacitor iOS shell
        run: npx cap sync ios

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$HOME/asc"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$HOME/asc/AuthKey.p8"

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          export ASC_KEY_PATH="$HOME/asc/AuthKey.p8"
          bundle exec fastlane ios beta 2>/dev/null || fastlane ios beta
