name: iOS TestFlight

# Manual trigger only. Run from the Actions tab (or `gh workflow run
# ios-testflight.yml`) whenever the native shell changes. Ordinary web
# deploys do NOT need this — the shell loads the live site.
#
# server_url: the shell's origin defaults to https://next-bar.com
# (canonical). Until next-bar.com DNS points at production, pass the
# current live host here for an internal dogfood build — one field, no
# code change. INTERNAL TestFlight groups only for any remote-origin
# build (see TESTFLIGHT-ARCH-DECISION on the overnight branch).
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Override the shell origin (pre-DNS dogfood only; blank = https://next-bar.com)'
        required: false
        default: ''

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build-and-upload:
    # Apple rejects ASC uploads built with SDKs older than iOS 26 (altool
    # 409 on the first signed run, 2026-08-04). Runner images ship one
    # Xcode major per macOS version, so macos-15 (Xcode 16.4) can never
    # satisfy this; macos-26 defaults to Xcode 26.x / iOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Capacitor CLI 8.x hard-requires Node >= 22 (first live run of
          # this workflow failed on 20). 24 matches local dev.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync Capacitor iOS shell
        env:
          CAP_SERVER_URL: ${{ inputs.server_url }}
        run: |
          # An empty input must not override the canonical default.
          if [ -z "$CAP_SERVER_URL" ]; then unset CAP_SERVER_URL; fi
          npx cap sync ios

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$HOME/asc"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$HOME/asc/AuthKey.p8"

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          # CHOOSE THE LAUNCHER, THEN RUN THE LANE EXACTLY ONCE.
          #
          # This was `bundle exec fastlane ios beta 2>/dev/null || fastlane ios beta`,
          # which is three problems in one line:
          #
          #   1. `|| fastlane ios beta` re-runs the WHOLE build-and-upload lane
          #      after ANY failure, including a failure that happened after the
          #      IPA was already uploaded. A retry then races an upload that may
          #      well have succeeded, and TestFlight is not a safe place to guess.
          #   2. `2>/dev/null` discards the first attempt's stderr — the only
          #      record of why it failed — so the log shows the second failure
          #      and never the first.
          #   3. There is no Gemfile in this repository, so `bundle exec` fails
          #      immediately on EVERY run. The fallback was not an occasional
          #      safety net; it was the actual code path, taken every time, with
          #      a silent failure in front of it.
          #
          # So: decide which launcher is real BEFORE running anything, say which
          # one was chosen, and run once with stderr intact. The step's exit
          # status is fastlane's own.
          set -euo pipefail
          export ASC_KEY_PATH="$HOME/asc/AuthKey.p8"

          if [ -f Gemfile ] && bundle check >/dev/null 2>&1; then
            echo "fastlane launcher: bundle exec (Gemfile present and satisfied)"
            bundle exec fastlane ios beta
          else
            echo "fastlane launcher: system fastlane (no satisfied Gemfile)"
            fastlane ios beta
          fi

      # A FAILED LANE IS NOT AUTOMATICALLY A FAILED UPLOAD. The build and the
      # upload are one lane, so a non-zero exit can mean the IPA never built, or
      # that it uploaded and something after it failed. Re-running blind is how
      # a duplicate build reaches TestFlight. This says so where the person
      # deciding will actually be looking.
      - name: Explain what to check before retrying
        if: failure()
        run: |
          echo "::warning::The TestFlight lane failed. Check App Store Connect for a build with number ${{ github.run_number }} BEFORE re-running this workflow — the upload may have completed even though the lane did not."
